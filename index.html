<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<meta name="apple-mobile-web-app-title" content="誕生日カレンダー">
<title>誕生日カレンダー</title>
<link rel="stylesheet" href="styles.css">
<script src="app.js" defer></script>
</head>
<body>

<header class="header">
  <div class="header__name">誕生日カレンダー</div>

  <div class="header__actions">
    <div class="header__search">
      <svg width="16" height="16" viewBox="0 0 32 32" aria-hidden="true"><path d="M29 27.586l-7.552-7.552a11.018 11.018 0 10-1.414 1.414L27.586 29zM4 13a9 9 0 119 9 9.01 9.01 0 01-9-9z"/></svg>
      <input type="text" id="search" placeholder="生徒を検索" aria-label="生徒を検索">
    </div>

    <button class="header__action header__action--icon" id="searchOpen" aria-label="生徒を検索">
      <svg width="20" height="20" viewBox="0 0 32 32" aria-hidden="true"><path d="M29 27.586l-7.552-7.552a11.018 11.018 0 10-1.414 1.414L27.586 29zM4 13a9 9 0 119 9 9.01 9.01 0 01-9-9z"/></svg>
    </button>

    <a class="header__action" href="birthdays.ics" download="birthdays.ics">
      <svg width="20" height="20" viewBox="0 0 32 32" aria-hidden="true"><path d="M26 4h-4V2h-2v2h-8V2h-2v2H6a2 2 0 00-2 2v20a2 2 0 002 2h20a2 2 0 002-2V6a2 2 0 00-2-2zm0 22H6V12h20zm0-16H6V6h4v2h2V6h8v2h2V6h4z"/><path d="M17 17v-3h-2v3h-3v2h3v3h2v-3h3v-2h-3z"/></svg>
      <span class="header__action-label">カレンダーに追加</span>
    </a>
  </div>
</header>

<main class="content">
  <div class="notification" id="notice">
    <div class="notification__title">カレンダーのデータを読み込めませんでした</div>
    <div class="notification__body">
      <button class="btn" id="noticeReload">再読み込み</button>
    </div>
  </div>

  <div class="toolbar">
    <div>
      <h1 class="heading" id="monthLabel">—</h1>
      <p class="caption" id="monthCaption">読み込み中…</p>
    </div>
    <div class="toolbar__right">
      <button class="btn" id="prev" aria-label="前の月">
        <svg width="16" height="16" viewBox="0 0 32 32" aria-hidden="true"><path d="M20 24l-10-8 10-8z"/></svg>
      </button>
      <button class="btn" id="today">今日</button>
      <button class="btn" id="next" aria-label="次の月">
        <svg width="16" height="16" viewBox="0 0 32 32" aria-hidden="true"><path d="M12 8l10 8-10 8z"/></svg>
      </button>
    </div>
  </div>

  <div class="calendar" id="calendar"></div>
</main>

<!-- Mobile-only full-screen search -->
<div class="search-view" id="searchView" aria-hidden="true">
  <div class="search-view__bar">
    <button class="search-view__back" id="searchClose" aria-label="戻る">
      <svg width="20" height="20" viewBox="0 0 32 32" aria-hidden="true"><path d="M13 26l1.41-1.41L6.83 17H29v-2H6.83l7.58-7.59L13 6 3 16l10 10z"/></svg>
    </button>
    <input type="text" id="searchInput" placeholder="生徒を検索" aria-label="生徒を検索">
  </div>
  <div class="search-view__body" id="searchResults"></div>
</div>

<aside class="panel" id="panel" aria-hidden="true">
  <div class="panel__header">
    <div>
      <h2 class="panel__title" id="panelTitle"></h2>
      <p class="panel__sub" id="panelSub"></p>
    </div>
    <button class="panel__close" id="panelClose" aria-label="閉じる">
      <svg width="20" height="20" viewBox="0 0 32 32" aria-hidden="true"><path d="M24 9.4L22.6 8 16 14.6 9.4 8 8 9.4l6.6 6.6L8 22.6 9.4 24l6.6-6.6 6.6 6.6 1.4-1.4-6.6-6.6L24 9.4z"/></svg>
    </button>
  </div>
  <div class="panel__body" id="panelBody"></div>
</aside>

</body>
</html>
